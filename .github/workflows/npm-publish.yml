name: Publish to npm
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing verified release tag
        required: true
        type: string
permissions:
  contents: read
jobs:
  validate:
    if: vars.NPM_PUBLISH_ENABLED == 'true' && github.event.repository.private == false
    uses: ./.github/workflows/validate.yml
    with:
      ref: ${{ inputs.tag }}
  publish:
    needs: validate
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11
      - name: Publish the existing release archive using OIDC
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          node -e 'if (process.env.RELEASE_TAG !== "v" + JSON.parse(require("fs").readFileSync("package.json")).version) process.exit(1)'
          gh release download "$RELEASE_TAG" --pattern '*.tgz' --pattern '*.sha256' --dir artifacts
          cd artifacts
          sha256sum --check ./*.sha256
          npm publish ./*.tgz --access public --provenance --tag next
