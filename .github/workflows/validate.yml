name: Validate SDK
on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ''
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.12.4
      - run: uv sync --locked --extra media --python '${{ matrix.python }}' --directory python
      - run: uv run --directory python ruff check .
      - run: uv run --directory python pytest
      - run: uv build --directory python
      - run: uv run twine check dist/*
        working-directory: python
      - name: Install built wheel in a clean consumer
        run: |
          python -m venv "$RUNNER_TEMP/python-consumer"
          "$RUNNER_TEMP/python-consumer/bin/pip" install python/dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/python-consumer/bin/python" -c 'from clone_sdk import CloneClient, AsyncCloneClient; print("Python imports passed")'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: matrix.python == '3.11'
        with:
          name: python-package
          path: python/dist/*
          if-no-files-found: error
          retention-days: 7
  sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:public
      - name: Scan public Git history for secrets
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$RUNNER_TEMP/gitleaks.tar.gz" \
            | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --log-opts=--all .
      - run: pnpm audit --audit-level high
      - run: pnpm generate:types && git diff --exit-code -- src/generated/api-types.ts
      - run: pnpm check
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser
      - run: pnpm test:package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sdk-package
          path: |
            artifacts/*.tgz
            artifacts/*.sha256
          if-no-files-found: error
          retention-days: 7
