name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  validate:
    uses: ./.github/workflows/validate.yml
  release:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
      - name: Require matching version tag
        run: node -e 'if (process.env.GITHUB_REF_NAME !== "v" + JSON.parse(require("fs").readFileSync("package.json")).version) process.exit(1)'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sdk-package
          path: artifacts
      - name: Publish verified GitHub archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          (cd artifacts && sha256sum --check ./*.sha256)
          gh release create "$GITHUB_REF_NAME" artifacts/*.tgz artifacts/*.sha256 \
            --verify-tag --prerelease --title "Clone SDK $GITHUB_REF_NAME" --notes-file CHANGELOG.md
      - name: Verify authenticated release download and installation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          download_dir="$RUNNER_TEMP/sdk-release-download"
          consumer_dir="$RUNNER_TEMP/sdk-release-consumer"
          gh release download "$GITHUB_REF_NAME" --pattern '*.tgz' --pattern '*.sha256' --dir "$download_dir"
          (cd "$download_dir" && sha256sum --check ./*.sha256)
          npm install --prefix "$consumer_dir" --ignore-scripts "$download_dir"/*.tgz
          cd "$consumer_dir"
          node --input-type=module -e 'await import("@clone-ai/tab-completion"); await import("@clone-ai/tab-completion/server")'
