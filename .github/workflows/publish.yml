name: Publish registries
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing verified GitHub release tag
        required: true
        type: string
      registry:
        description: Registry with configured publisher authority
        required: true
        type: choice
        options: [npm, pypi]
      npm_tag:
        description: npm distribution tag assigned during publication
        required: false
        type: choice
        default: next
        options: [next, latest]
      npm_verify_only:
        description: Verify an already submitted npm release without republishing
        required: false
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: publish-${{ inputs.registry }}-${{ inputs.release_tag }}
  cancel-in-progress: false
jobs:
  release_check:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.release.outputs.ref }}
    steps:
      - name: Require an existing non-draft release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          REGISTRY: ${{ inputs.registry }}
          NPM_ENABLED: ${{ vars.NPM_PUBLISH_ENABLED }}
          PYPI_ENABLED: ${{ vars.PYPI_PUBLISH_ENABLED }}
        run: |
          set -euo pipefail
          if [[ "$REGISTRY" == npm ]]; then
            [[ "$NPM_ENABLED" == true ]] || { echo 'npm publisher has not been enabled'; exit 1; }
          else
            [[ "$PYPI_ENABLED" == true ]] || { echo 'PyPI publisher has not been enabled'; exit 1; }
          fi
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh release view "$RELEASE_TAG" --json isDraft --jq 'if .isDraft then error("Draft release") else true end'
          echo "ref=refs/tags/$RELEASE_TAG" >> "$GITHUB_OUTPUT"
  validate:
    needs: release_check
    uses: ./.github/workflows/validate.yml
    with:
      ref: ${{ needs.release_check.outputs.ref }}
  npm:
    if: inputs.registry == 'npm'
    needs: [release_check, validate]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.release_check.outputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.2'
      - run: npm install --global npm@11.7.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: sdk-package
          path: artifacts
      - name: Verify immutable release matches the tested package
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          node -e 'if (process.env.RELEASE_TAG !== "v" + JSON.parse(require("fs").readFileSync("package.json")).version) process.exit(1)'
          gh release view "$RELEASE_TAG" --json isDraft --jq 'if .isDraft then error("Draft release") else true end'
          gh release download "$RELEASE_TAG" --pattern '*.tgz' --pattern '*.sha256' --dir release
          (cd release && sha256sum --check ./*.sha256)
          mkdir tested-package released-package
          tar -xzf artifacts/*.tgz -C tested-package
          tar -xzf release/*.tgz -C released-package
          node scripts/verify-release.mjs tested-package/package released-package/package
      - name: Publish package with configured trusted publisher
        if: ${{ !inputs.npm_verify_only }}
        env:
          NPM_TAG: ${{ inputs.npm_tag || 'next' }}
        run: |
          set -euo pipefail
          [[ "$NPM_TAG" == next || "$NPM_TAG" == latest ]]
          npm publish ./release/*.tgz --access public --tag "$NPM_TAG" --provenance
      - name: Verify anonymous registry installation
        run: |
          set -euo pipefail
          version=$(node -p 'JSON.parse(require("fs").readFileSync("package.json")).version')
          package_spec="@clone-ai/tab-completion@$version"
          unset NPM_TOKEN NODE_AUTH_TOKEN
          export NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/anonymous-user.npmrc"
          export NPM_CONFIG_GLOBALCONFIG="$RUNNER_TEMP/anonymous-global.npmrc"
          touch "$NPM_CONFIG_USERCONFIG" "$NPM_CONFIG_GLOBALCONFIG"
          # npm may accept publication before registry processing completes.
          for attempt in {1..20}; do
            if npm view "$package_spec" version --prefer-online > "$RUNNER_TEMP/npm-version.txt"; then
              [[ "$(cat "$RUNNER_TEMP/npm-version.txt")" == "$version" ]] && break
            fi
            [[ "$attempt" -lt 20 ]] || { echo 'npm release is not available after bounded verification'; exit 1; }
            sleep 15
          done
          consumer="$RUNNER_TEMP/npm-consumer"
          npm install --prefix "$consumer" --ignore-scripts --prefer-online "$package_spec"
          cd "$consumer"
          node --input-type=module -e 'await import("@clone-ai/tab-completion"); await import("@clone-ai/tab-completion/server")'
          npm audit signatures
          registry_tarball=$(npm pack "$package_spec" --pack-destination "$RUNNER_TEMP" --json | node -e 'let s=""; process.stdin.on("data",c=>s+=c).on("end",()=>console.log(JSON.parse(s)[0].filename))')
          cmp "$RUNNER_TEMP/$registry_tarball" "$GITHUB_WORKSPACE/release/clone-ai-tab-completion-$version.tgz"
  pypi:
    if: inputs.registry == 'pypi'
    needs: [release_check, validate]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.release_check.outputs.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: python-package
          path: dist
      - name: Require release distributions to match tested Python files
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          gh release download "$RELEASE_TAG" --pattern '*.whl' --pattern '*.tar.gz' --dir released-python
          for file in dist/*; do cmp "$file" "released-python/$(basename "$file")"; done
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verify anonymous PyPI installation
        run: |
          version=$(python -c 'from pathlib import Path; print(next(Path("dist").glob("*.whl")).name.split("-")[1])')
          python -m venv "$RUNNER_TEMP/pypi-consumer"
          "$RUNNER_TEMP/pypi-consumer/bin/pip" install "clone-sdk==$version"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/pypi-consumer/bin/python" -c 'from clone_sdk import CloneClient, AsyncCloneClient; print("PyPI imports passed")'
